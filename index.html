<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telar</title>
<meta name="description" content="Telar: estudio de arte generativo en el navegador. 14 generadores, paletas, acabados y exportación PNG, SVG y video.">
<meta name="theme-color" content="#121110">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121110'/%3E%3Cpath d='M8 9h16M8 14h16M8 19h16M8 24h16' stroke='%23e3b75a' stroke-width='2'/%3E%3Cpath d='M11 6v20M16 6v20M21 6v20' stroke='%23ece6dc' stroke-width='2' stroke-dasharray='3 2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hanken+Grotesk:wght@400;500;600;700&family=Martian+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/telar.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M6 9h20M6 14h20M6 19h20M6 24h20" /><path class="warp" d="M11 5v22M16 5v22M21 5v22" /></svg></span>
      <span class="brand-name">Telar</span>
    </div>

    <div class="seed-box" title="La semilla decide todo el azar de la obra. La misma semilla da siempre la misma imagen.">
      <label for="seedInput" class="seed-label">Semilla</label>
      <input id="seedInput" class="seed-input" spellcheck="false" autocomplete="off">
      <button class="icon-btn" id="btnNewSeed" title="Nueva semilla (Espacio)" aria-label="Nueva semilla">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" class="dot"/><circle cx="15.5" cy="15.5" r="1.3" class="dot"/><circle cx="12" cy="12" r="1.3" class="dot"/></svg>
      </button>
    </div>

    <div class="top-actions">
      <button class="icon-btn" id="btnUndo" title="Deshacer (Z)" aria-label="Deshacer"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/></svg></button>
      <button class="icon-btn" id="btnRedo" title="Rehacer (Y)" aria-label="Rehacer"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h4"/></svg></button>
      <span class="divider" aria-hidden="true"></span>
      <button class="btn ghost" id="btnVariations" title="Ver 9 variaciones (V)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Variaciones</span></button>
      <button class="btn ghost" id="btnGallery" title="Galería (G)"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="m4 16 5-5 4 4 3-3 4 4"/><circle cx="15.5" cy="9" r="1.5"/></svg><span>Galería</span><b class="count" id="galleryCount">0</b></button>
      <button class="btn ghost" id="btnSave" title="Guardar en la galería (S)"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span>Guardar</span></button>
      <button class="icon-btn" id="btnHelp" title="Atajos de teclado (?)" aria-label="Atajos de teclado"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h1M10 10h1M14 10h1M18 10h0M7 14h10"/></svg></button>
      <button class="btn primary" id="btnExport" title="Exportar (E)"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>Exportar</span></button>
    </div>
  </header>

  <aside class="panel panel-left" id="panelLeft">
    <section class="block" data-tab="generador">
      <div class="block-head"><h2>Generador</h2><span class="hint" id="genCount"></span></div>
      <div class="gen-list" id="genList"></div>
    </section>
    <section class="block" id="paramsBlock" data-tab="ajustes">
      <div class="block-head">
        <h2 id="paramsTitle">Ajustes</h2>
        <div class="head-actions">
          <button class="mini" id="btnMutate" title="Mutar ajustes ligeramente (M)">Mutar</button>
          <button class="mini" id="btnRandomParams" title="Ajustes al azar (A)">Azar</button>
          <button class="mini" id="btnResetParams" title="Volver a los valores originales">Restablecer</button>
        </div>
      </div>
      <p class="gen-desc" id="genDesc"></p>
      <div class="params" id="params"></div>
    </section>
  </aside>

  <main class="stage" id="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas" aria-label="Obra generada"></canvas>
      <div class="busy" id="busy" hidden><span></span>Tejiendo…</div>
    </div>
    <div class="stage-bar">
      <div class="stage-info" id="stageInfo"></div>
      <div class="stage-tools">
        <button class="icon-btn" id="btnBuild" title="Ver cómo se teje (B)" aria-label="Animar construcción"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="icon-btn" id="btnCompare" title="Mantén pulsado para comparar con la versión anterior" aria-label="Comparar con anterior"><svg viewBox="0 0 24 24"><path d="M12 3v18"/><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M12 5h8.5v14H12" class="fillhalf"/></svg></button>
        <button class="icon-btn" id="btnFullscreen" title="Pantalla completa (F)" aria-label="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>
  </main>

  <aside class="panel panel-right" id="panelRight">
    <section class="block" data-tab="color">
      <div class="block-head">
        <h2>Paleta</h2>
        <span class="hint" id="paletteName"></span>
      </div>
      <div class="swatches" id="swatches"></div>
      <div class="row-actions">
        <button class="mini" id="btnHarmony" title="Nueva armonía respetando los colores fijados (H)">Armonía</button>
        <select id="harmonyMode" class="mini-select" aria-label="Tipo de armonía"></select>
        <button class="mini" id="btnShufflePal" title="Reordenar colores">Mezclar</button>
        <button class="mini" id="btnSwapBg" title="Intercambiar fondo con el primer color">Invertir</button>
      </div>
      <div class="row-actions">
        <button class="mini" id="btnAddColor">+ Color</button>
        <button class="mini" id="btnRemoveColor">− Color</button>
        <label class="mini file-mini" title="Extraer paleta de una foto">Desde foto<input type="file" id="paletteImage" accept="image/*"></label>
        <button class="mini" id="btnCopyPalette" title="Copiar como CSS">Copiar</button>
      </div>
      <div class="chips" id="paletteTags"></div>
      <div class="palette-grid" id="paletteGrid"></div>
    </section>

    <section class="block" data-tab="acabado">
      <div class="block-head"><h2>Lienzo</h2></div>
      <div class="aspect-grid" id="aspectGrid"></div>
      <div class="block-head sub"><h2>Acabado</h2><button class="mini" id="btnFinishReset">Quitar</button></div>
      <div class="params" id="finishParams"></div>
    </section>
  </aside>

  <nav class="tabbar" id="tabbar" aria-label="Paneles">
    <button data-tab="generador" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><circle cx="17.5" cy="17.5" r="3.5"/></svg>Generador</button>
    <button data-tab="ajustes"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ajustes</button>
    <button data-tab="color"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="9" r="1.4" class="dot"/><circle cx="15" cy="9" r="1.4" class="dot"/><circle cx="9" cy="15" r="1.4" class="dot"/></svg>Color</button>
    <button data-tab="acabado"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><rect x="7.5" y="7.5" width="9" height="9"/></svg>Lienzo</button>
  </nav>
</div>

<!-- Modales -->
<div class="modal" id="modalVariations" hidden>
  <div class="modal-card wide" role="dialog" aria-modal="true" aria-labelledby="varTitle">
    <header><h3 id="varTitle">Variaciones</h3>
      <div class="seg" id="varMode">
        <button data-mode="seed" class="active">Semillas</button>
        <button data-mode="params">Ajustes</button>
        <button data-mode="palette">Paletas</button>
        <button data-mode="all">Todo</button>
      </div>
      <button class="icon-btn close" data-close aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <p class="modal-note">Toca una variación para adoptarla. <button class="link" id="btnMoreVariations">Generar otras nueve</button></p>
    <div class="var-grid" id="varGrid"></div>
  </div>
</div>

<div class="modal" id="modalGallery" hidden>
  <div class="modal-card wide" role="dialog" aria-modal="true" aria-labelledby="galTitle">
    <header><h3 id="galTitle">Galería</h3>
      <div class="head-actions">
        <button class="mini" id="btnGalleryExport">Exportar JSON</button>
        <label class="mini file-mini">Importar<input type="file" id="galleryImport" accept="application/json,.json"></label>
      </div>
      <button class="icon-btn close" data-close aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <p class="modal-note" id="galleryNote">Tus obras guardadas viven en este navegador.</p>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>
</div>

<div class="modal" id="modalExport" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="expTitle">
    <header><h3 id="expTitle">Exportar</h3>
      <button class="icon-btn close" data-close aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="export-body">
      <div class="export-preview"><img id="exportPreview" alt="Vista previa de la exportación"></div>
      <div class="export-controls">
        <label class="field-label">Plantillas</label>
        <div class="chips" id="exportPresets"></div>
        <label class="field-label" for="exportSize">Lado largo</label>
        <div class="size-row">
          <input type="range" id="exportSize" min="512" max="8192" step="64">
          <output id="exportSizeOut"></output>
        </div>
        <p class="export-dims" id="exportDims"></p>
        <div class="export-buttons">
          <button class="btn primary" id="btnExportPNG"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>PNG</span></button>
          <button class="btn" id="btnExportJPG"><span>JPG</span></button>
          <button class="btn" id="btnExportSVG" title="Vector editable; ideal para plotter"><span>SVG</span></button>
          <button class="btn" id="btnExportVideo" title="Graba la construcción en video WebM"><span>Video</span></button>
          <button class="btn" id="btnExportJSON" title="Receta para volver a generar la obra"><span>Receta</span></button>
          <button class="btn" id="btnCopyLink"><span>Copiar enlace</span></button>
        </div>
        <p class="export-status" id="exportStatus" role="status"></p>
        <p class="export-hint">El SVG conserva los trazos como vectores. Grano, papel y viñeta sólo se aplican a PNG, JPG y video.</p>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="modalHelp" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <header><h3 id="helpTitle">Atajos de teclado</h3>
      <button class="icon-btn close" data-close aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <dl class="keys" id="keysList"></dl>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/core.js"></script>
<script src="js/palettes.js"></script>
<script src="js/generators/organic.js"></script>
<script src="js/generators/geometric.js"></script>
<script src="js/generators/mathematical.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
